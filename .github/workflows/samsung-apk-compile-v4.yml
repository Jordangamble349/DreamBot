name: Samsung Pocket Remote compile v4
on:
  push:
    branches: [build-pocket-tv-remote]
    paths: [.github/workflows/samsung-apk-compile-v4.yml]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Unpack project
        run: |
          mkdir -p samsung-remote-project
          python3 - <<'PY'
          from pathlib import Path
          import base64, lzma, tarfile, io
          source = Path('.github/workflows/samsung-pocket-tv-apk.yml').read_text().splitlines()
          first = next(i for i, line in enumerate(source) if 'cat > /tmp/samsung-remote.b64' in line)
          last = next(i for i in range(first + 1, len(source)) if source[i].strip() == 'B64SOURCE')
          packed = base64.b64decode(''.join(line.strip() for line in source[first+1:last]))
          payload = lzma.decompress(packed)
          with tarfile.open(fileobj=io.BytesIO(payload)) as archive:
              archive.extractall('samsung-remote-project', filter='data')
          PY
      - name: Fix long-to-int socket framing compilation
        run: |
          sed -i 's/out.write(((long)len >> shift) \& 0xFF);/out.write((int)(((long)len >> shift) \& 0xFF));/' samsung-remote-project/app/src/main/java/com/pockettv/remote/SamsungSocket.java
      - name: Install Android SDK
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o /tmp/cmdline.zip
          unzip -q /tmp/cmdline.zip -d /tmp/cmdline
          mv /tmp/cmdline/cmdline-tools "$HOME/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" --licenses || true
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Assemble installable debug APK
        working-directory: samsung-remote-project
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Pocket-Remote-APK
          path: samsung-remote-project/app/build/outputs/apk/debug/app-debug.apk
